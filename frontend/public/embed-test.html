<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapFlow Embed Test</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fc;
        color: #1f2937;
      }

      .card {
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 16px;
        color: #6b7280;
        line-height: 1.5;
      }

      form {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 12px;
        margin-bottom: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: #4b5563;
      }

      input {
        height: 36px;
        padding: 0 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font: inherit;
      }

      button {
        align-self: end;
        height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      pre {
        margin: 0 0 16px;
        padding: 12px;
        border-radius: 6px;
        background: #f3f4f6;
        font-size: 12px;
        overflow-x: auto;
      }

      .frame-shell {
        width: 100%;
        height: 400px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        background: #f5f4f2;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #6b7280;
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Embed 预览</h1>
      <p>输入已发布的 public slug，页面会加载真正的 `/tiles/:slug/embed` iframe。</p>

      <form id="embed-form">
        <label>
          服务地址
          <input id="origin" type="text" value="http://localhost:3000" />
        </label>
        <label>
          Public slug
          <input id="slug" type="text" placeholder="example-public-slug" />
        </label>
        <button type="submit">加载</button>
      </form>

      <pre id="code-preview">请先输入 public slug。</pre>

      <div class="frame-shell">
        <div id="empty-state" class="empty">等待加载 iframe 预览</div>
        <iframe id="preview-frame" title="MapFlow embed preview" hidden></iframe>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const form = document.getElementById('embed-form');
      const originInput = document.getElementById('origin');
      const slugInput = document.getElementById('slug');
      const codePreview = document.getElementById('code-preview');
      const emptyState = document.getElementById('empty-state');
      const previewFrame = document.getElementById('preview-frame');

      originInput.value = params.get('origin') || originInput.value;
      slugInput.value = params.get('slug') || '';

      function render() {
        const origin = originInput.value.trim().replace(/\/$/, '');
        const slug = slugInput.value.trim();

        if (!slug) {
          codePreview.textContent = '请先输入 public slug。';
          previewFrame.hidden = true;
          previewFrame.removeAttribute('src');
          emptyState.hidden = false;
          return;
        }

        const src = `${origin}/tiles/${encodeURIComponent(slug)}/embed`;
        codePreview.textContent = `<iframe src="${src}" title="MapFlow map" loading="lazy" style="width:100%;height:400px;border:0;"></iframe>`;
        previewFrame.src = src;
        previewFrame.hidden = false;
        emptyState.hidden = true;

        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('origin', origin);
        nextUrl.searchParams.set('slug', slug);
        window.history.replaceState(null, '', nextUrl);
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        render();
      });

      render();
    </script>
  </body>
</html>
