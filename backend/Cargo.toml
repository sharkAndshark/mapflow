[package]
name = "backend"
version = "0.0.1"
edition = "2021"
default-run = "backend"

[features]
default = []
embed-web-dist = ["dep:include_dir"]
embed-spatial-extension = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "8.0"
hex = "0.4"
duckdb = { version = "1.4.4", features = ["bundled", "chrono"] }
axum-extra = { version = "0.12.5", features = ["query"] }
bcrypt = "0.18"
regex = "1.10"
lazy_static = "1.5"
uuid = { version = "1.21", features = ["v4", "serde"] }
axum-login = "0.18"
tower-sessions = "0.14"
tower-cookies = "0.11"
time = "0.3"
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
moka = { version = "0.12", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
include_dir = { version = "0.7.4", optional = true }
clap = { version = "4", features = ["derive", "env"] }
tokio-postgres = "0.7"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
tray-item = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
mvt-reader = "2.3.0"
flate2 = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
