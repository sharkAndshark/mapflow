name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check spatial extension version sync
        run: bash scripts/ci/check_spatial_extension_version.sh

      - name: Download spatial extension for build
        run: |
          bash scripts/release/spatial_extension_artifact.sh download linux_amd64 backend/extensions/spatial.duckdb_extension

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Backend fmt (check)
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Backend clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

      - name: Backend tests
        run: cargo test --manifest-path backend/Cargo.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend format (check)
        working-directory: frontend
        run: npm run format:check

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Frontend E2E tests
        working-directory: frontend
        run: npm run test:e2e

  docker_smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Resolve spatial extension archive
        id: spatial
        shell: bash
        run: |
          set -euo pipefail
          url="$(bash scripts/release/spatial_extension_artifact.sh url linux_amd64)"
          echo "archive_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            SPATIAL_EXTENSION_ARCHIVE_URL=${{ steps.spatial.outputs.archive_url }}
          tags: mapflow-smoke:${{ github.ref_name }}

      - name: Smoke test container
        run: bash scripts/smoke/smoke-docker.sh --image mapflow-smoke:${{ github.ref_name }}

  binaries:
    needs:
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact_id: linux-amd64
            duckdb_platform: linux_amd64
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            artifact_id: linux-arm64
            duckdb_platform: linux_arm64
          - os: macos-14
            rust_target: aarch64-apple-darwin
            artifact_id: darwin-arm64
            duckdb_platform: osx_arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_id: windows-amd64
            duckdb_platform: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Prepare spatial extension for binary embedding
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/spatial_extension_artifact.sh download \
            "${{ matrix.duckdb_platform }}" \
            "backend/extensions/spatial.duckdb_extension"

      - name: Build backend binaries
        run: cargo build --release --locked --manifest-path backend/Cargo.toml --target ${{ matrix.rust_target }} --features embed-web-dist,embed-spatial-extension

      - name: Smoke test binary
        shell: bash
        run: |
          bash scripts/smoke/smoke-binary.sh \
            --binary "target/${{ matrix.rust_target }}/release/backend${{ matrix.os == 'windows-latest' && '.exe' || '' }}"

      - name: Smoke test crash recovery
        shell: bash
        run: |
          bash scripts/smoke/smoke-crash-recovery.sh \
            --binary "target/${{ matrix.rust_target }}/release/backend${{ matrix.os == 'windows-latest' && '.exe' || '' }}" \
            --port 3010

      - name: Smoke test graceful shutdown (Unix SIGHUP)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/smoke/smoke-graceful-shutdown.sh \
            --binary "target/${{ matrix.rust_target }}/release/backend" \
            --port 3011

      - name: Package bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle_binary="target/${{ matrix.rust_target }}/release/backend${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # Publish desktop entrypoint only; keep console binary for smoke/dev.
            bundle_binary="target/${{ matrix.rust_target }}/release/mapflow-desktop.exe"
          fi
          bash scripts/release/package_bundle.sh \
            "${{ github.ref_name }}" \
            "${{ matrix.artifact_id }}" \
            "${bundle_binary}" \
            "release-assets"

      - name: Package deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/package_deb.sh \
            "${{ github.ref_name }}" \
            "${{ matrix.artifact_id }}" \
            "target/${{ matrix.rust_target }}/release/backend" \
            "release-assets"

      - name: Verify deb package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(ls release-assets/*.deb | head -n 1)"
          dpkg-deb --info "${deb_path}" >/dev/null
          contents="$(dpkg-deb --contents "${deb_path}")"
          grep -q "./usr/bin/mapflow" <<<"${contents}"
          grep -q "./usr/share/mapflow/spatial-extension-manifest.json" <<<"${contents}"
          grep -q "./usr/share/doc/mapflow/README.md" <<<"${contents}"
          grep -q "./usr/share/doc/mapflow/LICENSE" <<<"${contents}"
          grep -q "./usr/share/doc/mapflow/NOTICE" <<<"${contents}"

      - name: Smoke test installed deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(ls release-assets/*.deb | head -n 1)"
          cleanup() {
            sudo dpkg -r mapflow >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo dpkg -i "${deb_path}"
          /usr/bin/mapflow --version
          bash scripts/smoke/smoke-binary.sh --binary /usr/bin/mapflow --port 3317

      - name: Upload binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact_id }}
          path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.deb

  docker_build:
    needs: docker_smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            duckdb_platform: linux_amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            duckdb_platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/mapflow" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve spatial extension archive
        id: spatial
        shell: bash
        run: |
          set -euo pipefail
          url="$(bash scripts/release/spatial_extension_artifact.sh url "${{ matrix.duckdb_platform }}")"
          echo "archive_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SPATIAL_EXTENSION_ARCHIVE_URL=${{ steps.spatial.outputs.archive_url }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}.txt

  docker_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker_build
    steps:
      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/mapflow" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"

          sources=""
          for file in /tmp/digests/*/*.txt; do
            digest="$(cat "$file")"
            sources="${sources} ${image}@${digest}"
          done

          tags=""
          while IFS= read -r tag; do
            tags="${tags} --tag ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create ${tags} ${sources}

  github_release:
    runs-on: ubuntu-latest
    needs:
      - docker_manifest
      - binaries
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/**/*.deb
